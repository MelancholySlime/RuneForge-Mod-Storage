name: 🗂️ Migrate Structure to RF_Storage1

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ "MIGRATE" để xác nhận di chuyển Part_X vào RF_Storage1/'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'MIGRATE'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🗂️ Di chuyển Part_X → RF_Storage1/Part_X
        run: |
          echo "🔍 Kiểm tra cấu trúc hiện tại..."
          ls -la

          # Tạo thư mục RF_Storage1 nếu chưa có
          mkdir -p RF_Storage1

          MOVED=0
          for dir in Part*/; do
            dir="${dir%/}"  # bỏ trailing slash
            if [ -d "$dir" ] && [[ "$dir" =~ ^Part[0-9]+$ ]]; then
              if [ -d "RF_Storage1/$dir" ]; then
                echo "  ⚠️ RF_Storage1/$dir đã tồn tại, bỏ qua $dir"
              else
                mv "$dir" "RF_Storage1/$dir"
                echo "  ✅ Moved: $dir → RF_Storage1/$dir"
                MOVED=$((MOVED + 1))
              fi
            fi
          done

          echo ""
          echo "📦 Đã di chuyển $MOVED thư mục Part vào RF_Storage1/"
          echo ""
          echo "📁 Cấu trúc sau migration:"
          ls -la RF_Storage1/ 2>/dev/null || echo "  (empty)"

      - name: 📋 Xóa _runeforge_files.json cũ để force backfill
        run: |
          if [ -f "_runeforge_files.json" ]; then
            # Reset JSON về format mới rỗng để backfill tự build lại
            echo '{"storage_part_counts":{},"part_mod_counts":{},"files":[]}' > _runeforge_files.json
            echo "✅ Đã reset _runeforge_files.json về format mới"
          else
            echo "ℹ️ Không tìm thấy _runeforge_files.json"
          fi

      - name: 📤 Commit và push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --cached --stat
          git commit -m "🗂️ [Migration] Restructure Part_X → RF_Storage1/Part_X"
          git push
          echo "🎉 Migration hoàn tất!"
