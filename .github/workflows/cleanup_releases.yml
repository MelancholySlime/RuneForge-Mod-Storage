name: 🗑️ Cleanup All Releases & Tags

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ "DELETE" để xác nhận xóa toàn bộ releases và tags'
        required: true
        default: ''

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DELETE'
    
    steps:
      - name: 🗑️ Xóa toàn bộ Releases và Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "🔍 Lấy danh sách tất cả Releases..."
          
          PAGE=1
          TOTAL_RELEASES=0
          TOTAL_TAGS=0
          
          while true; do
            # Lấy tối đa 100 releases mỗi trang
            RELEASES=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/releases?per_page=100&page=$PAGE" \
              --jq '.[].id' 2>/dev/null)
            
            if [ -z "$RELEASES" ]; then
              echo "✅ Không còn release nào ở trang $PAGE. Dừng."
              break
            fi
            
            echo "📄 Trang $PAGE: Tìm thấy $(echo "$RELEASES" | wc -l) releases"
            
            while IFS= read -r RELEASE_ID; do
              if [ -n "$RELEASE_ID" ]; then
                gh api \
                  --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/$REPO/releases/$RELEASE_ID" && \
                  echo "  🗑️ Đã xóa release ID: $RELEASE_ID" || \
                  echo "  ⚠️ Lỗi xóa release ID: $RELEASE_ID"
                TOTAL_RELEASES=$((TOTAL_RELEASES + 1))
              fi
            done <<< "$RELEASES"
            
            PAGE=$((PAGE + 1))
          done
          
          echo ""
          echo "🏷️ Lấy danh sách tất cả Tags..."
          
          PAGE=1
          while true; do
            TAGS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/tags?per_page=100&page=$PAGE" \
              --jq '.[].name' 2>/dev/null)
            
            if [ -z "$TAGS" ]; then
              echo "✅ Không còn tag nào ở trang $PAGE. Dừng."
              break
            fi
            
            echo "📄 Trang $PAGE: Tìm thấy $(echo "$TAGS" | wc -l) tags"
            
            while IFS= read -r TAG_NAME; do
              if [ -n "$TAG_NAME" ]; then
                gh api \
                  --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/$REPO/git/refs/tags/$TAG_NAME" && \
                  echo "  🏷️ Đã xóa tag: $TAG_NAME" || \
                  echo "  ⚠️ Lỗi xóa tag: $TAG_NAME"
                TOTAL_TAGS=$((TOTAL_TAGS + 1))
              fi
            done <<< "$TAGS"
            
            PAGE=$((PAGE + 1))
          done
          
          echo ""
          echo "🎉 Hoàn tất! Đã xóa $TOTAL_RELEASES releases và $TOTAL_TAGS tags."
